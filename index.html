<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            text-align: center;

            background: #1c1c1c;
            border-radius: 20px;
        }

        .profile {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #333;

            margin: 0 auto 20px;
        }

        h1 {
            margin: 10px 0;
        }

        p {
            color: #aaa;
        }

        .button {
            display: block;
            margin: 15px 0;
            padding: 14px;

            background: white;
            color: black;

            text-decoration: none;
            border-radius: 10px;

            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile"></div>

        <h1>alfarizi</h1>

        <p>
            Halo! selamat datang di website saya 🚀
        </p>

        <a class="button" href="https://instagram.com/alfrzmlna">
            Instagram
        </a>

        <a class="button" href="#">
            GitHub
        </a>

    </div>
<a class="button" href="#">
    Instagram
</a>

<a class="button" href="#">
    GitHub
</a>

<button class="button" onclick="sayHello()">
    Klik Saya
</button>

<script>
    function sayHello() {
        alert("Halo! Kamu berhasil menjalankan JavaScript 🚀");
    }
</script>

</body>
</html>
